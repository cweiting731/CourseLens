<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Agent UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .card-bg { background-color: #BECBD3; border-radius: 20px; border: 2px solid #000; }
        .item-bg { background-color: #E6F1ED; border-radius: 10px; border: 1.5px solid #000; }
        .modal-overlay { background: rgba(0,0,0,0.5); display: none; }
    </style>
</head>

<body class="bg-[#8E9BAE] p-8">

<div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-6xl mx-auto">

    <!-- ===== 左欄 ===== -->
    <div class="flex flex-col gap-6">

        <!-- 符合搜尋條件的課程 -->
        <div class="card-bg p-6 h-[550px] flex flex-col">
            <div class="font-bold text-xl mb-3">
                符合搜尋條件的課程
            </div>

            <div id="query-status" class="text-sm text-gray-500 mb-2 hidden">
                查詢中…
            </div>

            <div id="query-results" class="flex-grow overflow-y-auto space-y-3 pr-2">
                <div class="text-gray-400 italic">
                    尚未進行搜尋
                </div>
            </div>

            <div class="mt-4 flex gap-2 item-bg p-3">
                <input id="chatInput" type="text" placeholder="對話框 (text editor)"
                       class="bg-transparent flex-grow outline-none px-2">
                <button id="sendBtn" onclick="sendChat()" class="text-2xl hover:scale-110 transition">
                    <i class="fas fa-play"></i>
                </button>
            </div>
        </div>

        <!-- 學分計算總表-->
        <div class="card-bg p-4 h-[250px]">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-xl">學分計算總表</span>
                <button onclick="loadAll()" class="text-xl hover:rotate-180 transition duration-500">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <div id="summaryTable" class="space-y-2 max-h-[170px] overflow-y-auto pr-1"></div>
        </div>

    </div>

    <!-- ===== 右欄 ===== -->
    <div class="flex flex-col gap-6">

        <!-- 課程總列表 -->
        <div class="card-bg p-4 flex-grow min-h-[300px]">
            <div class="flex justify-between items-center mb-4">
                <span class="font-bold text-xl">課程總列表</span>
                <div class="space-x-3">
                    <button onclick="openModal()" class="text-2xl hover:text-blue-600">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button onclick="loadAll()" class="text-xl hover:rotate-180 transition duration-500">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div id="course-list" class="space-y-3 overflow-y-auto h-[730px] pr-2"></div>
        </div>

    </div>

</div>

<!-- ===== Modal ===== -->
<div id="modal" class="modal-overlay fixed inset-0 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl border-2 border-black w-80">
        <h3 id="modalTitle" class="font-bold mb-4">課程編輯</h3>
        <input type="hidden" id="courseId">

        <div class="space-y-2 text-sm">
            <input id="m_name" placeholder="課程名稱" class="w-full border p-1 rounded">

            <select id="m_cat" class="w-full border p-1 rounded">
                <option value="">請選擇課程分類</option>
                <option value="必修">必修</option>
                <option value="系內選修">系內選修</option>
                <option value="系外選修">系外選修</option>
                <option value="領域通識">領域通識</option>
                <option value="融合通識">融合通識</option>
                <option value="大學國文">大學國文</option>
                <option value="體育">體育</option>
                <option value="英文">英文</option>
                <option value="踏溯台南">踏溯台南</option>
                <option value="其他">其他</option>
            </select>

            <input id="m_cat_other" placeholder="其他分類請輸入"
                   class="w-full border p-1 rounded hidden">

            <input id="m_credit" type="number" placeholder="學分數"
                   class="w-full border p-1 rounded">

            <select id="m_status" class="w-full border p-1 rounded">
                <option value="">請選擇狀態</option>
                <option value="完成">完成</option>
                <option value="進行中">進行中</option>
            </select>

            <input id="m_score" type="number" placeholder="分數 (-1 if none)"
                   class="w-full border p-1 rounded">

            <input id="m_teacher" placeholder="授課教師"
                   class="w-full border p-1 rounded">

            <select
                id="m_gen"
                class="w-full border p-1 rounded hidden">
                <option value="">請選擇通識分類</option>
                <option value="人文學">人文學</option>
                <option value="社會科學">社會科學</option>
                <option value="自然與工程科學">自然與工程科學</option>
                <option value="生命科學與健康">生命科學與健康</option>
                <option value="科際整合領域">科際整合領域</option>
            </select>

            <textarea id="m_detail" placeholder="課程細項"
                      class="w-full border p-1 rounded"></textarea>
        </div>

        <div class="mt-4 flex justify-end gap-2">
            <button onclick="closeModal()" class="px-4 py-1 bg-gray-200 rounded">取消</button>
            <button onclick="saveCourse()" class="px-4 py-1 bg-blue-500 text-white rounded">儲存</button>
        </div>
    </div>
</div>
    <script>
        const API_BASE = "http://127.0.0.1:5000";
        let currentQueryResults = null;

        // 載入所有資料
        async function loadAll() {
            const res = await fetch(`${API_BASE}/courses`);
            const data = await res.json();
            renderCourses(data);
            renderSummary(data);
        }

        function renderCourses(courses) {
            const container = document.getElementById('course-list');
            const leftContainer = document.getElementById('query-results');
            const html = courses.map(c => `
                <div class="item-bg p-3 flex justify-between items-center shadow-sm">
                    <div class="flex gap-4 font-medium">
                        <span>${c.name}</span>
                        <span class="text-gray-600">${c.category}</span>
                    </div>
                    <div class="flex gap-3 text-lg">
                        <button onclick='openModal(${JSON.stringify(c)})' class="text-gray-700 hover:text-blue-600"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteCourse(${c.id})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
            container.innerHTML = html;
        }

        function renderSummary(courses) {
            const summaryBody = document.getElementById('summaryTable');
            if (!summaryBody) return;

            const summary = {};

            courses.forEach(course => {
                const category = course.category || "未分類";
                const credit = Number(course.credit) || 0;
                const status = course.status || "";

                if (!summary[category]) {
                    summary[category] = { completed: 0, ongoing: 0 };
                }

                if (status === "完成") {
                    summary[category].completed += credit;
                } else if (status === "進行中") {
                    summary[category].ongoing += credit;
                }
            });

            let html = "";

            for (const category in summary) {
                html += `
                    <div class="
                        flex items-center justify-between
                        bg-[#faf5dc]
                        px-4 py-3
                        rounded-xl
                        border-[1.5px] border-black
                    ">
                        <div class="font-medium">
                            ${category}
                        </div>

                        <div class="flex gap-2">
                            <span class="
                                px-3 py-1
                                rounded-full
                                bg-[#dcefd6]
                                text-[#1f4d1f]
                                border-[1.2px] border-black
                                text-xs font-medium
                            ">
                                完成 ${summary[category].completed}
                            </span>

                            <span class="
                                px-3 py-1
                                rounded-full
                                bg-[#dbe9f6]
                                border-[1.2px] border-black
                                text-[#143a66]
                                text-xs font-medium
                            ">
                                進行中 ${summary[category].ongoing}
                            </span>
                        </div>
                    </div>
                `;
            }

            summaryBody.innerHTML = html;
        }


        // 課程分類其他選項顯示控制
        document.getElementById('m_cat').addEventListener('change', function () {
            const otherInput = document.getElementById('m_cat_other');
            const genSelect = document.getElementById('m_gen');

            // 控制「其他分類」
            if (this.value === '其他') {
                otherInput.classList.remove('hidden');
            } else {
                otherInput.classList.add('hidden');
                otherInput.value = '';
            }

            // 控制「通識分類」
            if (this.value === '領域通識') {
                genSelect.classList.remove('hidden');
            } else {
                genSelect.classList.add('hidden');
                genSelect.value = '';
            }
        });

        document.getElementById('m_status').addEventListener('change', function () {
            const scoreInput = document.getElementById('m_score');

            if (this.value === "進行中") {
                scoreInput.value = -1;      // 強制設 -1
                scoreInput.disabled = true; // 鎖住不能改
            } else {
                scoreInput.disabled = false; // 完成時可填
            }
        });



        // Modal 控制
        function openModal(course = null) {
            document.getElementById('modal').style.display = 'flex';
            if(course) {
                const predefinedCategories = [
                    "必修","系內選修","系外選修","領域通識","融合通識",
                    "大學國文","體育","英文","踏溯台南"
                ];                  
                document.getElementById('modalTitle').innerText = "編輯課程";
                document.getElementById('courseId').value = course.id;
                document.getElementById('m_name').value = course.name;
                if (predefinedCategories.includes(course.category)) {
                    document.getElementById('m_cat').value = course.category;
                    document.getElementById('m_cat_other').classList.add('hidden');
                    document.getElementById('m_cat_other').value = '';
                } else {
                    document.getElementById('m_cat').value = "其他";
                    document.getElementById('m_cat_other').classList.remove('hidden');
                    document.getElementById('m_cat_other').value = course.category;
                }
                document.getElementById('m_credit').value = course.credit;
                document.getElementById('m_status').value = course.status;
                document.getElementById('m_score').value = course.score;
                document.getElementById('m_teacher').value = course.teacher;
                const genSelect = document.getElementById('m_gen');
                if (course.category === "領域通識") {
                    genSelect.classList.remove('hidden');
                    genSelect.value = course.generalType || "";
                } else {
                    genSelect.classList.add('hidden');
                    genSelect.value = "";
                }
                document.getElementById('m_detail').value = course.detail;
            } else {
                document.getElementById('modalTitle').innerText = "新增課程";
                document.getElementById('courseId').value = "";

                // 清空 input / textarea 並解除 disabled
                document.querySelectorAll('#modal input, #modal textarea')
                    .forEach(i => {
                        i.value = "";
                        i.disabled = false;
                    });

                document.getElementById('m_cat').value = "必修";      // 預設必修
                document.getElementById('m_status').value = "進行中"; // 預設進行中

                document.getElementById('m_score').value = -1;
                document.getElementById('m_score').disabled = true;

                document.getElementById('m_cat_other').classList.add('hidden');
                document.getElementById('m_gen').classList.add('hidden');
                document.getElementById('m_gen').value = '';

            }

        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }


        // 送出新增或更新
        async function saveCourse() {
            const id = document.getElementById('courseId').value;
            const status = document.getElementById('m_status').value;
            const credit = parseInt(document.getElementById('m_credit').value) || 0;

            const name = document.getElementById('m_name').value.trim();
            const rawScore = parseInt(document.getElementById('m_score').value);
            const finalScore = status === "進行中" ? -1 : (isNaN(rawScore) ? -1 : rawScore);

            const teacher = document.getElementById('m_teacher').value;
            const generalType = document.getElementById('m_gen').value;
            const detail = document.getElementById('m_detail').value;

            const selectedCategory = document.getElementById('m_cat').value;
            const otherInput = document.getElementById('m_cat_other');

            if (!name || !selectedCategory || !status) {
                alert("請填寫課程名稱、分類與狀態");
                return;
            }
            //處理其他分類
            let finalCategory = selectedCategory;
            if (selectedCategory === "其他") {
                if (!otherInput || !otherInput.value.trim()) {
                    alert("請輸入其他課程分類");
                    return;
                }
                finalCategory = otherInput.value.trim();
            }

            const payload = {
                name,
                category: finalCategory,
                credit,
                status,
                score: finalScore,
                teacher,
                generalType,
                detail
            };

            if (id) payload.id = parseInt(id);

            try {
                const res = await fetch(`${API_BASE}/course`, {
                    method: id ? "PUT" : "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    throw new Error("後端回傳錯誤");
                }

                closeModal();
                loadAll();
                if (currentQueryResults) {
                    // 找出被修改的課程 id
                    const updatedId = id ? parseInt(id) : null;

                    // 如果是編輯課程，更新搜尋結果內容
                    if (updatedId) {
                        currentQueryResults = currentQueryResults.map(c =>
                            c.id === updatedId
                                ? { ...c, ...payload, id: updatedId }
                                : c
                        );
                    }

                    renderQueryResults(currentQueryResults);
                }

            } catch (err) {
                console.error(err);
                alert("儲存失敗，請查看 console");
            }
        }
        // 刪除 API
        async function deleteCourse(id) {
            if(!confirm("確定要刪除嗎？")) return;
            await fetch(`${API_BASE}/course/${id}`, { method: "DELETE" });
            loadAll();
            if (currentQueryResults) {
                currentQueryResults = currentQueryResults.filter(c => c.id !== id);
                renderQueryResults(currentQueryResults);
            }
        }

        

        function renderQueryResults(courses) {
            const container = document.getElementById('query-results');

            if (!courses || courses.length === 0) {
                container.innerHTML = `
                    <div class="text-gray-400 italic">
                        查無符合條件的課程
                    </div>
                `;
                return;
            }

            
            container.innerHTML = courses.map(c => `
                <div class="item-bg p-3 flex justify-between items-center shadow-sm">
                    <div class="flex flex-col">
                        <span class="font-medium">${c.name}</span>
                        <span class="text-sm text-gray-600">${c.category}</span>
                    </div>
                    <div class="flex gap-3 text-lg">
                        <button
                            onclick='openModal(${JSON.stringify(c)})'
                            class="text-gray-700 hover:text-blue-600"
                            title="編輯">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button
                            onclick="deleteCourse(${c.id})"
                            class="text-red-500 hover:text-red-700"
                            title="刪除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 對話框 API
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const statusText = document.getElementById('query-status');
            const queryResults = document.getElementById('query-results');

            const text = input.value.trim();
            if (!text) return;

            // UI 進入「查詢中」狀態
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusText.classList.remove('hidden');
            statusText.innerText = "查詢中…";

            queryResults.innerHTML = "";

            try {
                //呼叫後端
                const res = await fetch(`${API_BASE}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });

                if (!res.ok) {
                    throw new Error("查詢失敗");
                }

                const result = await res.json();
                // 假設後端回傳的是課程陣列
                // result = [{ name, category, ... }, ...]
                currentQueryResults = result; 
                //更新左側查詢結果
                renderQueryResults(result);

                statusText.innerText = `查詢完成，共${result.length} 筆資料`;

            } catch (err) {
                console.error(err);
                statusText.innerText = "查詢失敗，請再試一次";
            } finally {
                // UI 恢復
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                input.value = "";
            }
    }

        // 初始載入
        loadAll();
    </script>
</body>
</html>
